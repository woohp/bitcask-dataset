[project]
name = "bitcask-dataset"
version = "0.3.0"
description = "A small, mmap-backed dataset of byte blobs, optionally keyed"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lz4>=4.4.5",
    "numpy>=2.1",
]
license = "BSD-3-Clause"
keywords = ["dataset", "mmap", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"
strict = true
ignore_missing_imports = true
python_version = "3.14"
warn_unreachable = true

[tool.ruff]
indent-width = 4
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
ignore = ["B028", "B905", "C408", "E203", "FURB118", "SIM102", "SIM108"]
preview = true
select = ["B", "C4", "E", "F", "FURB", "I", "PT", "Q", "SIM", "U", "YTT"]
